## credsync push identities (fleet.secrets)
## One ed25519 public key per host, printed on first boot by
## credsync-push-keygen.service. Paste each here so receivers authorize the
## pushing host (forced-command, locked to `credsync write`).
[credsync_push_keys]
# rhodium = "ssh-ed25519 AAAA... credsync-push@rhodium"
carbon = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL8sPOTczCLA0ewf3pLRHM9XmC+Gtfg+NdKyKougipAj credsync-push@carbon"
gallium = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJLUO/3YrFAIOMVz2gEkuJx2BHAs+HQeA4yrI3rMuNlY credsync-push@gallium"

